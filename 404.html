<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanDine | 404 — Page Not Found</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    /* ----- GLOBAL RESET & SCANDINE THEME TOKENS ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-page: #f8fafc;
      --surface-color: #ffffff;
      --surface-alt: #f1f5f9;
      --text-primary: #1e1e2f;
      --text-secondary: #525270;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --accent-soft: rgba(249, 115, 22, 0.12);
      --border-light: #e5e7ef;
      --shadow-lg: 0 24px 60px -18px rgba(15, 23, 42, 0.16);
      --transition: all 0.2s ease;
    }

    html[data-theme="dark"] {
      --bg-page: #0b0b12;
      --surface-color: #151521;
      --surface-alt: #10101a;
      --text-primary: #f0f0f5;
      --text-secondary: #a4a4bc;
      --accent: #fb923c;
      --accent-hover: #f97316;
      --accent-soft: rgba(251, 146, 60, 0.16);
      --border-light: #262638;
      --shadow-lg: 0 24px 60px -18px rgba(0, 0, 0, 0.65);
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      transition: background-color 0.25s, color 0.25s;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 80% 15%, rgba(249, 115, 22, 0.09), transparent 45%),
        radial-gradient(circle at 18% 85%, rgba(16, 185, 129, 0.05), transparent 45%);
    }

    /* FLOATING THEME / RTL CONTROLS (NO NAVBAR) */
    .utility-corner {
      position: fixed;
      top: 1.15rem;
      right: 1.4rem;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    html[dir="rtl"] .utility-corner {
      right: auto;
      left: 1.4rem;
    }

    .util-btn {
      width: 2.35rem;
      height: 2.35rem;
      border-radius: 0.7rem;
      border: 1px solid var(--border-light);
      background: var(--surface-color);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .util-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* CENTERED 404 CARD */
    .error-shell {
      width: 100%;
      max-width: 560px;
    }

    .error-card {
      background: var(--surface-color);
      border: 1px solid var(--border-light);
      border-radius: 1.65rem;
      padding: 2.75rem 2.25rem;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      text-decoration: none;
      margin-bottom: 1.75rem;
    }

    .brand-mark span {
      color: var(--accent);
    }

    /* STYLIZED QR 404 EMBLEM */
    .qr-emblem {
      position: relative;
      width: 168px;
      height: 168px;
      margin: 0 auto 1.75rem;
      border-radius: 1.5rem;
      background: var(--surface-alt);
      border: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      overflow: hidden;
    }

    .qr-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: var(--accent);
      border-style: solid;
    }

    .qr-corner.tl { top: 14px; left: 14px; border-width: 3px 0 0 3px; border-top-left-radius: 8px; }
    .qr-corner.tr { top: 14px; right: 14px; border-width: 3px 3px 0 0; border-top-right-radius: 8px; }
    .qr-corner.bl { bottom: 14px; left: 14px; border-width: 0 0 3px 3px; border-bottom-left-radius: 8px; }
    .qr-corner.br { bottom: 14px; right: 14px; border-width: 0 3px 3px 0; border-bottom-right-radius: 8px; }

    .scan-beam {
      position: absolute;
      left: 16px;
      right: 16px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      box-shadow: 0 0 12px var(--accent);
      animation: scanSweep 2.6s ease-in-out infinite;
    }

    @keyframes scanSweep {
      0%, 100% { top: 24px; opacity: 0.45; }
      50% { top: 142px; opacity: 1; }
    }

    .qr-icon {
      font-size: 1.65rem;
      color: var(--accent);
      line-height: 1;
    }

    .error-code {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text-primary);
    }

    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.85rem;
    }

    h1 {
      font-size: clamp(1.55rem, 3.2vw, 2.05rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
    }

    .error-copy {
      font-size: 0.98rem;
      line-height: 1.65;
      color: var(--text-secondary);
      max-width: 420px;
      margin: 0 auto 2rem;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.85rem;
      margin-bottom: 1.75rem;
    }

    .btn-primary,
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.85rem 1.55rem;
      border-radius: 0.85rem;
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: 1px solid var(--accent);
      box-shadow: 0 10px 22px -10px rgba(249, 115, 22, 0.55);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--surface-alt);
      color: var(--text-primary);
      border: 1px solid var(--border-light);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem 1.15rem;
      padding-top: 1.35rem;
      border-top: 1px solid var(--border-light);
      font-size: 0.86rem;
    }

    .quick-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }

    .quick-links a:hover {
      color: var(--accent);
    }

    html[dir="rtl"] #goBackBtn i {
      transform: scaleX(-1);
    }

    @media screen and (max-width: 520px) {
      body {
        padding: 4.25rem 1rem 1.5rem;
      }

      .error-card {
        padding: 2rem 1.35rem;
        border-radius: 1.35rem;
      }

      .qr-emblem {
        width: 144px;
        height: 144px;
      }

      .error-code {
        font-size: 2.5rem;
      }

      .action-row {
        flex-direction: column;
      }

      .btn-primary,
      .btn-secondary {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="utility-corner">
    <button type="button" class="util-btn" id="themeToggle" aria-label="Toggle dark mode">
      <i class="fas fa-moon" id="themeIcon"></i>
    </button>
    <button type="button" class="util-btn" id="rtlToggle" aria-label="Toggle RTL/LTR">
      <i class="fas fa-arrow-right-arrow-left"></i>
    </button>
  </div>

  <main class="error-shell">
    <section class="error-card" aria-labelledby="errorTitle">
      <a href="index.html" class="brand-mark">Scan<span>Dine</span></a>

      <div class="qr-emblem" aria-hidden="true">
        <span class="qr-corner tl"></span>
        <span class="qr-corner tr"></span>
        <span class="qr-corner bl"></span>
        <span class="qr-corner br"></span>
        <span class="scan-beam"></span>
        <i class="fas fa-utensils qr-icon"></i>
        <span class="error-code">404</span>
      </div>

      <span class="error-badge">
        <i class="fas fa-qrcode"></i> Off the Menu
      </span>

      <h1 id="errorTitle">This table doesn't exist</h1>
      <p class="error-copy">
        The QR link or page you scanned couldn't be found. It may have been moved, renamed, or taken off today's menu.
      </p>

      <div class="action-row">
        <a href="index.html" class="btn-primary">
          <i class="fas fa-house"></i> Back to Home
        </a>
        <button type="button" class="btn-secondary" id="goBackBtn">
          <i class="fas fa-arrow-left"></i> Go Back
        </button>
      </div>

      <div class="quick-links" aria-label="Helpful destinations">
        <a href="features.html">Features</a>
        <a href="pricing%20plans.html">Pricing Plans</a>
        <a href="demo%20request.html">Demo Request</a>
        <a href="contact.html">Contact</a>
      </div>
    </section>
  </main>

  <script>
    (function() {
      const htmlEl = document.documentElement;
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const rtlToggle = document.getElementById('rtlToggle');
      const goBackBtn = document.getElementById('goBackBtn');

      function applyTheme(dark) {
        if (dark) {
          htmlEl.setAttribute('data-theme', 'dark');
          themeIcon.classList.replace('fa-moon', 'fa-sun');
          localStorage.setItem('theme', 'dark');
        } else {
          htmlEl.removeAttribute('data-theme');
          themeIcon.classList.replace('fa-sun', 'fa-moon');
          localStorage.setItem('theme', 'light');
        }
      }
      if (localStorage.getItem('theme') === 'dark') applyTheme(true);
      themeToggle.addEventListener('click', () => applyTheme(htmlEl.getAttribute('data-theme') !== 'dark'));

      function applyDir(rtl) {
        htmlEl.setAttribute('dir', rtl ? 'rtl' : 'ltr');
        localStorage.setItem('dir', rtl ? 'rtl' : 'ltr');
      }
      if (localStorage.getItem('dir') === 'rtl') applyDir(true);
      rtlToggle.addEventListener('click', () => applyDir(htmlEl.getAttribute('dir') !== 'rtl'));

      goBackBtn.addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      });
    })();
  </script>
</body>
</html>
